<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --present: #10b981;
            --absent: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.1), transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(79, 70, 229, 0.1), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (max-width: 600px) {
            nav {
                padding: 1rem;
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Main Content */
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-value.good { color: var(--present); text-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .stat-value.warning { color: var(--warning); text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .stat-value.danger { color: var(--absent); text-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        /* Current Date Info */
        .date-info {
            text-align: right;
            margin-bottom: 2rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Table */
        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Status Badges */
        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .badge.present {
            background: rgba(16, 185, 129, 0.15);
            color: var(--present);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.absent {
            background: rgba(239, 68, 68, 0.15);
            color: var(--absent);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .empty-state {
            padding: 4rem;
            text-align: center;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            th, td {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
            .date-info {
                text-align: center;
            }
        }

    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">Student Portal</div>
        <div class="nav-user">
            <span id="userName">Welcome, Student</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="date-info" id="currentDate"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Overall Attendance</div>
                <div class="stat-value" id="percentageVal">--%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Classes Attended</div>
                <div class="stat-value" style="color: var(--text-main);" id="attendedVal">--/--</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Recent Attendance Records</h2>
            </div>
            <div class="table-responsive">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Period</th>
                            <th>Subject</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" class="empty-state">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Authentication Check
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.role !== 'student') {
            window.location.href = '/login.html';
        }

        document.getElementById('userName').textContent = `Welcome, ${user.name}`;
        
        // Setup Date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);

        async function loadRecords() {
            try {
                const res = await fetch('/api/student/attendance', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                // Update Stats
                const pct = parseFloat(data.stats.percentage);
                const pctEl = document.getElementById('percentageVal');
                pctEl.textContent = `${data.stats.percentage}%`;
                
                if (pct >= 85) pctEl.className = 'stat-value good';
                else if (pct >= 75) pctEl.className = 'stat-value warning';
                else pctEl.className = 'stat-value danger';

                document.getElementById('attendedVal').textContent = `${data.stats.classesPresent} / ${data.stats.totalClasses}`;

                // Update Table
                const tbody = document.getElementById('tableBody');
                if (data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No attendance records found yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.records.forEach(record => {
                    const tr = document.createElement('tr');
                    
                    const dateObj = new Date(record.date);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    tr.innerHTML = `
                        <td>${formattedDate}</td>
                        <td>Period ${record.period}</td>
                        <td>${record.subject_name}</td>
                        <td>
                            <span class="badge ${record.status}">
                                ${record.status.charAt(0).toUpperCase() + record.status.slice(1)}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Failed to load attendance", err);
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="color: var(--error);">Error loading records.</td></tr>';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        loadRecords();
    </script>
</body>
</html>
